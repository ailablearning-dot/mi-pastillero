# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# @capgo/capacitor-social-login trae los cuatro proveedores encendidos por defecto.
# Solo usamos Google. El SDK de Facebook no se envía: es peso muerto y, en una app de salud,
# un SDK de terceros que obliga a declarar más en el formulario de datos de Google Play.
# Con esto el plugin compila contra sus propios stubs (src/facebookStubs), no contra el SDK.
# Apple y Twitter no añaden ninguna dependencia propia, así que se quedan como están.
socialLogin.facebook.include=false

# JAVA PARA GRADLE — es una ruta de ESTA máquina, y está aquí a propósito.
# Android Studio trae dentro un Java 25; Gradle 8.14 no lo entiende y la compilación muere con
# "Unsupported class file major version 69" antes de empezar. El Java bueno para esta combinación
# (Gradle 8.14 + plugin de Android 8.13) es el 21, instalado con `brew install openjdk@21`.
# Escrito aquí y no como variable de entorno para que valga IGUAL desde la terminal y desde
# Android Studio, en vez de funcionar en una y fallar en la otra.
# Si esto se clona en otra máquina: cambiar la ruta, o borrar la línea y fijar el "Gradle JDK"
# en los ajustes de Android Studio.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
