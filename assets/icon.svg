<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradiente del fondo: violet 500 → indigo 600, mismo que el logo del header -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Mitad roja de la pastilla con leve gradiente para profundidad -->
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Mitad blanca/crema con sombra sutil -->
    <linearGradient id="white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Sombra suave bajo la pastilla -->
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo: cuadrado completo, iOS aplica el squircle automáticamente -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Pastilla diagonal centrada, rotada -32° -->
  <g transform="translate(512 512) rotate(-32)" filter="url(#pillShadow)">
    <!-- Mitad blanca (izquierda en el grupo rotado, queda arriba-izquierda) -->
    <path d="M -340 -140 L 0 -140 L 0 140 L -340 140 A 140 140 0 0 1 -340 -140 Z" fill="url(#white)"/>
    <!-- Mitad roja (derecha del grupo rotado) -->
    <path d="M 0 -140 L 340 -140 A 140 140 0 0 1 340 140 L 0 140 Z" fill="url(#red)"/>
    <!-- Línea divisoria sutil -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>
    <!-- Brillo superior de la pastilla (efecto de luz) -->
    <ellipse cx="-100" cy="-90" rx="180" ry="22" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>
</svg>
