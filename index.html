<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Mi Pastillero</title>
    <meta name="description" content="Control de medicamentos diario" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mi Pastillero" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html {
        /* Base de 18px (default del navegador = 16px). Como la app usa clases rem de
           Tailwind (text-sm/xs, paddings, etc.), esto agranda TODA la UI ~12.5% de forma
           uniforme — pensado para adultos mayores, público objetivo de la app. */
        font-size: 18px;
        -webkit-text-size-adjust: 100%;
        height: 100%;
        overflow-x: hidden;
        overscroll-behavior: none;
        width: 100%;
        max-width: 100vw;
        touch-action: pan-y pinch-zoom;
        background-color: #f8fafc;
      }
      body, #root {
        height: 100%;
        overflow-x: hidden;
        overscroll-behavior: none;
        width: 100%;
        max-width: 100%;
        touch-action: pan-y pinch-zoom;
      }
      @media (prefers-color-scheme: dark) {
        html { background-color: #111827; }
        body { color-scheme: dark; }
      }
      /* Barra fija opaca que cubre el área del notch / Dynamic Island. Evita que el
         contenido se vea "metido" bajo la cámara al hacer scroll (reporte de tester
         con iPhone 16 Pro Max / Dynamic Island). No bloquea toques. */
      #safe-top {
        position: fixed; top: 0; left: 0; right: 0;
        height: env(safe-area-inset-top);
        background: #f8fafc;
        z-index: 100;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        #safe-top { background: #111827; }
      }
    </style>
  </head>
  <body>
    <div id="safe-top"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
